name: cloviana

x-api-base: &api-base
  build:
    context: ../api
    dockerfile: Dockerfile
    target: runner
  image: ghcr.io/cloviana/api:latest
  env_file:
    - .env
  environment:
    NODE_ENV: production
    ENVIRONMENT: production
    API_PORT: 5000
    API_HOST: 0.0.0.0
    RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
    REDIS_URL: redis://redis:6379
    KNOWLEDGE_BASE_URL: http://knowledge-base:8080
    AGENT_URL: http://agent:8000
  depends_on:
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    knowledge-base:
      condition: service_started
    agent:
      condition: service_started
  restart: unless-stopped
  networks:
    - appnet
  volumes:
    - knowledge-uploads:/data/knowledge-uploads

volumes:
  certbot-etc:
    name: cloviana_certbot_etc
  certbot-var:
    name: cloviana_certbot_var
  redis-data:
  qdrant-data:
  knowledge-uploads:

networks:
  appnet:

services:
  api:
    <<: *api-base
    container_name: api
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *api-base
    container_name: worker
    command: ["node", "dist/worker.js"]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - appnet

  knowledge-base:
    build:
      context: ../knowledge-base
      args:
        SPARSE_EMBEDDING_MODEL: ${SPARSE_EMBEDDING_MODEL:-Qdrant/bm25}
    image: ghcr.io/cloviana/knowledge-base:latest
    container_name: knowledge-base
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      UNSTRUCTURED_API_KEY: ${UNSTRUCTURED_API_KEY:?UNSTRUCTURED_API_KEY is required}
      UNSTRUCTURED_API_URL: ${UNSTRUCTURED_API_URL:-https://platform-api.transform.unstructured.io/api/v1}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:?VOYAGE_API_KEY is required}
    depends_on:
      - qdrant
    networks:
      - appnet

  agent-migrate:
    build:
      context: ../agent
    image: ghcr.io/cloviana/agent:${TAG:-latest}
    command: ["python", "-m", "agent.database.migrate"]
    restart: "no"
    environment:
      CLOVIANA_AGENT_DATABASE_URL: ${CLOVIANA_AGENT_DATABASE_URL:?CLOVIANA_AGENT_DATABASE_URL is required}
    networks:
      - appnet

  agent:
    build:
      context: ../agent
    image: ghcr.io/cloviana/agent:${TAG:-latest}
    container_name: agent
    restart: unless-stopped
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      EXA_API_KEY: ${EXA_API_KEY:?EXA_API_KEY is required}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required}
      CLOVIANA_AGENT_DATABASE_URL: ${CLOVIANA_AGENT_DATABASE_URL:?CLOVIANA_AGENT_DATABASE_URL is required}
      KNOWLEDGE_BASE_URL: http://knowledge-base:8080
      CLOVIANA_API_URL: http://api:5000/api
    networks:
      - appnet

  migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: builder           
    command: npx prisma migrate deploy
    env_file:
      - .env
    networks:
      - appnet

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_GA4_ID: G-C4Z5BHM2R1
    image: ghcr.io/cloviana/app:latest
    container_name: app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      NEXT_PUBLIC_GA4_ID: G-C4Z5BHM2R1
      SHADCNBLOCKS_API_KEY: sk_live_VUqEYAYbmOfoQE0oQgHRemcYL_ZgRq1R
    depends_on:
      - api
    restart: always
    networks:
      - appnet

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_GA4_ID: G-VSMD7B6WN1
        NEXT_PUBLIC_CLARITY_PROJECT_ID: w8oqyeitz6
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      NEXT_PUBLIC_GA4_ID: G-VSMD7B6WN1
      NEXT_PUBLIC_CLARITY_PROJECT_ID: w8oqyeitz6
      SHADCNBLOCKS_API_KEY: sk_live_VUqEYAYbmOfoQE0oQgHRemcYL_ZgRq1R
    image: ghcr.io/cloviana/web:latest
    container_name: web
    env_file:
      - .env
    restart: always
    networks:
      - appnet

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - appnet
