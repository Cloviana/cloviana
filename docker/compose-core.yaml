version: "3.9"

volumes:
  certbot-etc:
    name: cloviana_certbot_etc
  certbot-var:
    name: cloviana_certbot_var
  redis-data:

networks:
  appnet:

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/cloviana/api:latest
    container_name: api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 5000
      API_HOST: 0.0.0.0
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      ENVIRONMENT: production
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SMTP2GO_API_KEY: ${SMTP2GO_API_KEY}
      SMTP2GO_DEFAULT_FROM: ${SMTP2GO_DEFAULT_FROM}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_CDN_ENDPOINT: ${AZURE_CDN_ENDPOINT}
      SERANKING_API_KEY: ${SERANKING_API_KEY}
      IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CX: ${GOOGLE_CX}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
      SHOPIFY_HOST: ${SHOPIFY_HOST}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      appnet:

  migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: builder           
    command: npx prisma migrate deploy
    env_file:
      - .env
    networks:
      - appnet

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_GA4_ID: G-C4Z5BHM2R1
    image: ghcr.io/cloviana/app:latest
    container_name: app
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      NEXT_PUBLIC_GA4_ID: G-C4Z5BHM2R1
      GA4_API_SECRET: ${GA4_API_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
    depends_on:
      - api
    restart: always
    networks:
      - appnet

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_WEB_URL: ${WEB_URL}
        NEXT_PUBLIC_GA4_ID: G-VSMD7B6WN1
    environment:
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_WEB_URL: ${WEB_URL}
      NEXT_PUBLIC_GA4_ID: G-VSMD7B6WN1
      GA4_API_SECRET: ${GA4_API_SECRET}
    image: ghcr.io/cloviana/web:latest
    container_name: web
    restart: always
    networks:
      - appnet

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - appnet
