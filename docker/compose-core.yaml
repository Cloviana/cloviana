name: cloviana

volumes:
  redis-data:
  inngest-postgres-data:
  inngest-redis-data:

networks:
  appnet:

services:
  inngest:
    image: inngest/inngest:v1.22.0
    container_name: inngest
    command: ["inngest", "start"]
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-0123456789abcdef0123456789abcdef}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-abcdef0123456789abcdef0123456789}
      INNGEST_POSTGRES_URI: postgresql://inngest:${INNGEST_POSTGRES_PASSWORD:-inngest}@inngest-postgres:5432/inngest
      INNGEST_REDIS_URI: redis://inngest-redis:6379
    depends_on:
      inngest-postgres:
        condition: service_healthy
      inngest-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8288:8288"
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    networks:
      - appnet

  inngest-postgres:
    image: postgres:17-alpine
    container_name: inngest-postgres
    environment:
      POSTGRES_DB: inngest
      POSTGRES_USER: inngest
      POSTGRES_PASSWORD: ${INNGEST_POSTGRES_PASSWORD:-inngest}
    volumes:
      - inngest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inngest -d inngest"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    networks:
      - appnet

  inngest-redis:
    image: redis:7-alpine
    container_name: inngest-redis
    # Deliberately NO --maxmemory-policy here: this holds Inngest run state,
    # not cache. Evicting keys would silently corrupt in-flight runs. The
    # container limit is the guard instead.
    command: ["redis-server", "--appendonly", "yes"]
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - inngest-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    container_name: redis
    # Application cache: eviction is the correct behaviour when full, so cap
    # it rather than letting it grow into the host's memory.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    # maxmemory covers the dataset only; the container needs headroom above it
    # for buffers, COW during AOF rewrite, and the allocator.
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - appnet
