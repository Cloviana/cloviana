x-urls: &urls
  APP_URL: https://app.cloviana.com
  API_URL: https://api.cloviana.com/api
  WEB_INTERNAL_URL: http://web:3000

x-next-public-urls: &next-public-urls
  NEXT_PUBLIC_API_URL: https://api.cloviana.com/api
  NEXT_PUBLIC_APP_URL: https://app.cloviana.com

services:
  api:
    environment:
      <<: *urls

  worker:
    environment:
      <<: *urls

  app:
    build:
      args:
        <<: *next-public-urls
    environment:
      <<: *next-public-urls

  web:
    build:
      args:
        <<: *next-public-urls
        NEXT_PUBLIC_WEB_URL: https://cloviana.com
    environment:
      <<: *next-public-urls
      NEXT_PUBLIC_WEB_URL: https://cloviana.com

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - api
      - app
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped
    networks:
      appnet:
        aliases:
          - api.cloviana.com
          - app.cloviana.com
          - cloviana.com

  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot
    command: >
      renew
      --dns-cloudflare
      --dns-cloudflare-credentials /secrets/cloudflare.ini
      --dns-cloudflare-propagation-seconds 60
      --cert-name cloviana
      -d cloviana.com
      -d api.cloviana.com
      -d app.cloviana.com
      --non-interactive
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./cloudflare.ini:/secrets/cloudflare.ini:ro
    networks:
      - appnet
    restart: "no"
