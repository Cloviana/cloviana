# Development runs the API, admin and web on the host (`pnpm dev` in each
# folder). Docker only provides the shared infrastructure from compose-core.yaml
# (redis, inngest) plus the nginx below, which maps *.localhost names to the
# host ports. The database is the local postgres service below.
volumes:
  postgres-data:

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: cloviana
      POSTGRES_USER: cloviana
      POSTGRES_PASSWORD: cloviana
    ports:
      - "127.0.0.1:5433:5432"
    # Postgres 18 images keep data under /var/lib/postgresql (versioned subdir).
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloviana -d cloviana"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    mem_limit: 128m
    memswap_limit: 128m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      appnet:
        aliases:
          - api.localhost
          - admin.localhost
          - localhost

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  inngest:
    ports:
      - "127.0.0.1:8289:8289"
