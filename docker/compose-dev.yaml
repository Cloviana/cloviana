volumes:
  api-node-modules:
  app-node-modules:
  web-node-modules:
  web-next-cache:

services:
  api:
    build:
      target: dev
    image: ghcr.io/cloviana/api:dev
    command: ["pnpm", "start:dev"]
    environment:
      <<: [*urls, *local-supabase]
      NODE_ENV: development
      ENVIRONMENT: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../api:/app:cached
      - api-node-modules:/app/node_modules

  worker:
    build:
      target: dev
    image: ghcr.io/cloviana/api:dev
    command: ["pnpm", "start:worker:dev"]
    environment:
      <<: [*urls, *local-supabase]
      NODE_ENV: development
      ENVIRONMENT: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../api:/app:cached
      - api-node-modules:/app/node_modules

  knowledge-base:
    command:
      - uvicorn
      - knowledge_base.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
      - --reload-dir
      - /app/src
    environment:
      <<: *local-supabase
      ENVIRONMENT: development
      PYTHONPATH: /app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../knowledge-base:/app:cached

  app:
    build:
      target: dev
      args:
        <<: [*next-public-urls, *local-supabase-public]
    image: ghcr.io/cloviana/app:dev
    command: ["pnpm", "exec", "next", "dev", "--webpack", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      <<: [*next-public-urls, *local-supabase-public, *local-supabase]
      CI: "true"
      NODE_ENV: development
      ENVIRONMENT: development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../app:/app:cached
      - app-node-modules:/app/node_modules
      - type: tmpfs
        target: /app/.next

  web:
    build:
      target: dev
      args:
        <<: [*next-public-urls, *local-supabase-public]
        NEXT_PUBLIC_WEB_URL: http://localhost
    image: ghcr.io/cloviana/web:dev
    command: ["pnpm", "exec", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      <<: [*next-public-urls, *local-supabase-public, *local-supabase]
      CI: "true"
      NODE_ENV: development
      ENVIRONMENT: development
      NEXT_PUBLIC_WEB_URL: http://localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../web:/app:cached
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - app
      - web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      appnet:
        aliases:
          - api.localhost
          - app.localhost
          - supabase.localhost
          - studio.supabase.localhost
          - localhost

  migrate:
    environment:
      <<: *local-supabase
    extra_hosts:
      - "host.docker.internal:host-gateway"
