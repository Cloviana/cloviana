  app:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/app:dev
    command: >
      sh -c "pnpm install &&
             pnpm exec next dev --webpack -H 0.0.0.0 -p 3000"
    environment:
      CI: "true"
    volumes:
      # ponytail: Windows bind mount makes Next's scanner hit ENOMEM; rebuild app after edits.
      - app-node-modules:/app/node_modules
      - app-next-cache:/app/.next
    container_name: app

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/web:dev
    command: >
      sh -c "pnpm install &&
             pnpm exec next dev -H 0.0.0.0 -p 3000"
    environment:
      CI: "true"
    volumes:
      # ponytail: Windows bind mount makes Next's scanner hit ENOMEM; rebuild web after edits.
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next
    container_name: web

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - app
      - web
    networks:
      appnet:
        aliases:
          - api.localhost
          - app.localhost
          - localhost

