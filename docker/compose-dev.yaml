version: "3.9"

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/api:dev
    volumes:
      - ../api/src:/app/src:cached
      - ../api/prisma:/app/prisma:cached
    container_name: api

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/app:dev
    volumes:
      - ../app:/app:cached
    container_name: app

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/web:dev
    volumes:
      - ../web:/app:cached
    container_name: web

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - app
      - web
    networks:
      appnet:
        aliases:
          - api.localhost
          - app.localhost
          - localhost