# IMPORTANT: Docker seeds a named volume from the image only while the volume is
# still empty; after that the image's copy is ignored forever. So rebuilding an
# image after a dependency change does NOT refresh these — the container keeps
# the old node_modules, pnpm notices it disagrees with the bind-mounted lockfile
# (verifyDepsBeforeRun defaults to "install" on pnpm 11) and silently runs a full
# network install on every single start. After changing dependencies, drop the
# matching volume so it reseeds:
#
#   docker volume rm cloviana_app-node-modules   # or web-/api-
#
# Use targeted `volume rm`, never `down -v` — that would also wipe redis-data,
# inngest-postgres-data, qdrant-data and knowledge-uploads.
volumes:
  api-node-modules:
  app-node-modules:
  app-next-cache:
  web-node-modules:
  web-next-cache:

# Dev limits are deliberately higher than compose-core.yaml's production
# values: `pnpm start:dev` runs a TypeScript watch build and Next runs
# Turbopack, both far heavier than the compiled production entrypoints.
# Applying the prod numbers here would OOM on startup.
services:
  api:
    build:
      target: dev
    image: ghcr.io/cloviana/api:dev
    command: ["pnpm", "start:dev"]
    environment:
      <<: [*urls, *local-supabase]
      NODE_ENV: development
      ENVIRONMENT: development
      NODE_OPTIONS: --max-old-space-size=1536
    # Overrides compose-core.yaml's prod restart policy. In dev a crash should
    # stop and stay stopped so the error is visible — restarting on loop just
    # buries the stack trace under a rerun (this hid 284 restarts once).
    restart: "no"
    mem_limit: 2g
    memswap_limit: 2g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../api:/app:cached
      - api-node-modules:/app/node_modules

  knowledge-base:
    command:
      - uvicorn
      - knowledge_base.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
      - --reload-dir
      - /app/src
    environment:
      <<: *local-supabase
      ENVIRONMENT: development
      PYTHONPATH: /app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../knowledge-base:/app:cached

  # app and web are NOT started by default — you run them on the host with
  # `pnpm dev` (app on :3000, web on :3001) and nginx proxies to
  # host.docker.internal. Next's own docs advise against Docker for dev on
  # macOS: the bind mount makes HMR take seconds to minutes, and the container
  # needed a second node_modules that drifted from the host's on every install.
  #
  # The definitions stay here behind a profile so the containerized path is
  # still one flag away (and so compose-core.yaml's *production* app/web
  # definitions don't leak into dev if these were simply deleted):
  #
  #   docker compose --profile containerized up -d app web
  #
  # Note: going back also means pointing the two proxy_pass lines in
  # nginx/nginx.dev.conf at http://app:3000 / http://web:3000 again.
  app:
    profiles: ["containerized"]
    build:
      target: dev
      args:
        <<: [*next-public-urls, *local-supabase-public]
    image: ghcr.io/cloviana/app:dev
    command: ["pnpm", "exec", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      <<: [*next-public-urls, *local-supabase-public, *local-supabase]
      INTERNAL_API_URL: http://api:5000/api
      CI: "true"
      NODE_ENV: development
      ENVIRONMENT: development
      # Caps the JS heap only. Turbopack's core is Rust, so its allocations
      # are native and this flag does NOT bound them — mem_limit is the only
      # ceiling on the compiler itself. Measured: a cold compile of this app
      # (232 source files) peaks just over 2GB, so 2g killed it mid-build.
      # ponytail: 3g was sized for 232 files; the app has since grown to
      # ~259 and was OOMKilling on every cold compile. Bump when it grows further.
      NODE_OPTIONS: --max-old-space-size=1536
    restart: "no"
    mem_limit: 4g
    memswap_limit: 4g
    # Disabled in dev on purpose. Docker doesn't restart on health status, so
    # the check buys nothing here — it just polled "/" every 30s, which 404s
    # and made Turbopack compile /_not-found on a cold cache. It stays enabled
    # in compose-core.yaml, where prod actually needs it.
    healthcheck:
      disable: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../app:/app:cached
      - app-node-modules:/app/node_modules
      - app-next-cache:/app/.next

  web:
    profiles: ["containerized"]
    build:
      target: dev
      args:
        <<: [*next-public-urls, *local-supabase-public]
        NEXT_PUBLIC_WEB_URL: http://localhost
    image: ghcr.io/cloviana/web:dev
    command: ["pnpm", "exec", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      <<: [*next-public-urls, *local-supabase-public, *local-supabase]
      CI: "true"
      NODE_ENV: development
      ENVIRONMENT: development
      NEXT_PUBLIC_WEB_URL: http://localhost
      NODE_OPTIONS: --max-old-space-size=768
    restart: "no"
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      disable: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../web:/app:cached
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    mem_limit: 128m
    memswap_limit: 128m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      appnet:
        aliases:
          - api.localhost
          - app.localhost
          - supabase.localhost
          - studio.supabase.localhost
          - localhost

  migrate:
    environment:
      <<: *local-supabase
    extra_hosts:
      - "host.docker.internal:host-gateway"
