version: "3.9"

volumes:
  api-node-modules:
  web-node-modules:
  app-node-modules:
  knowledge-uploads:

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/api:dev
    command: >
      sh -c "pnpm install &&
             pnpm db:generate &&
             pnpm start:debug"
    environment:
      NODE_ENV: development
    volumes:
      - ../api:/app:cached
      - api-node-modules:/app/node_modules
      - knowledge-uploads:/data/knowledge-uploads
    container_name: api

  worker:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/api:dev
    command: >
      sh -c "pnpm install &&
             pnpm db:generate &&
             pnpm start:worker:dev"
    environment:
      NODE_ENV: development
    volumes:
      - ../api:/app:cached
      - api-node-modules:/app/node_modules
      - knowledge-uploads:/data/knowledge-uploads
    container_name: worker

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/app:dev
    command: >
      sh -c "pnpm install &&
             pnpm dev"
    environment:
      CI: "true"
    volumes:
      - ../app:/app:cached
      - app-node-modules:/app/node_modules
    container_name: app

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/web:dev
    command: >
      sh -c "pnpm install &&
             pnpm dev"
    environment:
      CI: "true"
    volumes:
      - ../web:/app:cached
      - web-node-modules:/app/node_modules
    container_name: web

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - app
      - web
    networks:
      appnet:
        aliases:
          - api.localhost
          - app.localhost
          - localhost

networks:
  appnet:
