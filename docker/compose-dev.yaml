version: "3.9"

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/api:dev
    volumes:
      - ../api/src:/app/src:cached
      - ../api/prisma:/app/prisma:cached
    container_name: api

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/dashboard:dev
    volumes:
      - ../dashboard:/app:cached
      - /app/node_modules
    container_name: dashboard

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/cloviana/web:dev
    volumes:
      - ../web:/app:cached
      - /app/node_modules
    container_name: web

  nginx:
    image: nginx:alpine
    container_name: nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
      - web
    networks:
      appnet:
        aliases:
          - api.localhost
          - dashboard.localhost
          - localhost