worker_processes  auto;  

events {
    worker_connections  1024; 
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=30s;

    upstream api {
        server api:8000;       
    }

    upstream dashboard {
        server dashboard:3000;       
    }

    upstream web {
        server web:3000;       
    }

    server {
        listen 80;
        server_name cloviana.com www.cloviana.com api.cloviana.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2;                               
        server_name api.cloviana.com;

        ssl_certificate     /etc/letsencrypt/live/cloviana.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cloviana.com/privkey.pem;

        location / {
            proxy_pass         http://api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        http2;
        server_name dashboard.cloviana.com;

        ssl_certificate     /etc/letsencrypt/live/cloviana.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cloviana.com/privkey.pem;

        location / {
            proxy_pass         http://dashboard$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        http2;
        server_name cloviana.com www.cloviana.com;

        ssl_certificate     /etc/letsencrypt/live/cloviana.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cloviana.com/privkey.pem;

        location / {
            proxy_pass         http://web$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
