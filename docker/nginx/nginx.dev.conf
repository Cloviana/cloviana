worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 50m;

    proxy_buffer_size       32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;
    large_client_header_buffers 4 32k;

    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name api.localhost;

        location / {
            set $upstream        http://api:5000;
            proxy_pass           $upstream;
            proxy_http_version   1.1;
            proxy_set_header     Host $host;
            proxy_set_header     X-Real-IP $remote_addr;
            proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            # SSE chat streaming: no buffering, allow long-lived streams
            proxy_buffering      off;
            proxy_read_timeout   300s;
            proxy_send_timeout   300s;
        }
    }

    server {
        listen 80;
        server_name app.localhost;

        location / {
            # app runs on the host (`cd app && pnpm dev`), not in a container.
            # Written as a literal, not `set $upstream` + variable: the variable
            # form defers resolution to the `resolver` above, which only knows
            # Docker's internal DNS and would never find host.docker.internal.
            proxy_pass           http://host.docker.internal:3000;
            proxy_http_version   1.1;
            proxy_set_header     Upgrade $http_upgrade;
            proxy_set_header     Connection $connection_upgrade;
            proxy_set_header     Host $host;
            proxy_set_header     X-Real-IP $remote_addr;
            proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            proxy_read_timeout   1h;
            proxy_send_timeout   1h;
            proxy_buffering      off;
        }
    }

    server {
        listen 80;
        server_name supabase.localhost;

        location / {
            proxy_pass           http://host.docker.internal:54321;
            proxy_http_version   1.1;
            proxy_set_header     Upgrade $http_upgrade;
            proxy_set_header     Connection $connection_upgrade;
            proxy_set_header     Host $host;
            proxy_set_header     X-Real-IP $remote_addr;
            proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            proxy_buffering      off;
        }
    }

    server {
        listen 80;
        server_name studio.supabase.localhost;

        location / {
            proxy_pass           http://host.docker.internal:54323;
            proxy_http_version   1.1;
            proxy_set_header     Upgrade $http_upgrade;
            proxy_set_header     Connection $connection_upgrade;
            proxy_set_header     Host $host;
            proxy_set_header     X-Real-IP $remote_addr;
            proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            proxy_read_timeout   1h;
            proxy_send_timeout   1h;
            proxy_buffering      off;
        }
    }

    server {
        listen 80 default_server;
        server_name localhost;

        location / {
            # web runs on the host too — see the app.localhost block above.
            proxy_pass           http://host.docker.internal:3001;
            proxy_http_version   1.1;
            proxy_set_header     Upgrade $http_upgrade;
            proxy_set_header     Connection $connection_upgrade;
            proxy_set_header     Host $host;
            proxy_set_header     X-Real-IP $remote_addr;
            proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header     X-Forwarded-Proto $scheme;
            proxy_read_timeout   1h;
            proxy_send_timeout   1h;
            proxy_buffering      off;
        }
    }
}
