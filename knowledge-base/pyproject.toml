[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-base"
version = "1.0.0"
description = "Internal document ingestion and retrieval service for Cloviana"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.133.1",
  "uvicorn==0.41.0",
  "qdrant-client==1.12.2",
  "fastembed==0.8.0",
  "PyYAML==6.0.3",
  "python-multipart==0.0.32",
  "pydantic==2.13.4",
  "pydantic-settings>=2.14.0",
  "backoff>=2.2.1",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "watchfiles",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["knowledge_base", "knowledge_base.*"]
