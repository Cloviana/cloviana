name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: 20.55.46.0
          username: cloviana-admin
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e

            cd ~/cloviana
            git fetch --all
            git reset --hard origin/main

            cd docker
            docker compose \
              -f compose-core.yaml \
              -f compose-prod.yaml \
              up -d --build
