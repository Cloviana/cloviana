name: Build & Push

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v3

      - name: Detect which folders changed
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            api:
              - 'api/**'
            dashboard:
              - 'dashboard/**'
            web:
              - 'web/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        if: needs.detect-changes.outputs.api == 'true'
        uses: docker/build-push-action@v3
        with:
          context: ./api
          file: ./api/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/api:${{ github.sha }}
            ghcr.io/cloviana/api:latest

      - name: Build & push Dashboard
        if: needs.detect-changes.outputs.dashboard == 'true'
        uses: docker/build-push-action@v3
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/dashboard:${{ github.sha }}
            ghcr.io/cloviana/dashboard:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build & push Web
        if: needs.detect-changes.outputs.web == 'true'
        uses: docker/build-push-action@v3
        with:
          context: ./web
          file: ./web/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/web:${{ github.sha }}
            ghcr.io/cloviana/web:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}
            NEXT_PUBLIC_WEB_URL=${{ env.WEB_URL }}
