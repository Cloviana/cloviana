name: Build & Push

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v3

      - name: Detect which folders changed
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            api:
              - 'api/**'
            app:
              - 'app/**'
            web:
              - 'web/**'

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        if: needs.detect-changes.outputs.api == 'true'
        uses: docker/build-push-action@v3
        with:
          context: ./api
          file: ./api/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/api:${{ github.sha }}
            ghcr.io/cloviana/api:latest

      - name: Build & push App
        if: needs.detect-changes.outputs.app == 'true'
        uses: docker/build-push-action@v3
        with:
          context: ./app
          file: ./app/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/app:${{ github.sha }}
            ghcr.io/cloviana/app:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - name: Build & push Web
        if: needs.detect-changes.outputs.web == 'true'
        uses: docker/build-push-action@v3
        with:
          context: ./web
          file: ./web/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/web:${{ github.sha }}
            ghcr.io/cloviana/web:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
            NEXT_PUBLIC_WEB_URL=${{ vars.WEB_URL }}
