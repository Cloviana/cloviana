name: Build & Push

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v3
        with:
          context: ./api
          file: ./api/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/api:${{ github.sha }}
            ghcr.io/cloviana/api:latest

      - name: Build & push Dashboard
        uses: docker/build-push-action@v3
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/dashboard:${{ github.sha }}
            ghcr.io/cloviana/dashboard:latest

      - name: Build & push Web
        uses: docker/build-push-action@v3
        with:
          context: ./web
          file: ./web/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/web:${{ github.sha }}
            ghcr.io/cloviana/web:latest
