name: Build & Push

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/api:${{ github.sha }}
            ghcr.io/cloviana/api:latest
          cache-from: type=registry,ref=ghcr.io/cloviana/api:buildcache
          cache-to: type=registry,ref=ghcr.io/cloviana/api:buildcache,mode=max
          provenance: false

      - name: Build & push App
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/app:${{ github.sha }}
            ghcr.io/cloviana/app:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_GA4_ID=${{ vars.APP_GA4_ID }}
          cache-from: type=registry,ref=ghcr.io/cloviana/app:buildcache
          cache-to: type=registry,ref=ghcr.io/cloviana/app:buildcache,mode=max
          provenance: false

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/cloviana/web:${{ github.sha }}
            ghcr.io/cloviana/web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
            NEXT_PUBLIC_WEB_URL=${{ vars.WEB_URL }}
            NEXT_PUBLIC_GA4_ID=${{ vars.WEB_GA4_ID }}
            NEXT_PUBLIC_CLARITY_PROJECT_ID=w8oqyeitz6
          cache-from: type=registry,ref=ghcr.io/cloviana/web:buildcache
          cache-to: type=registry,ref=ghcr.io/cloviana/web:buildcache,mode=max
          provenance: false
