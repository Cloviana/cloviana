name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Set TAG
        run: echo "TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port:     22
          script: |
            set -e

            cd /opt/cloviana
            git fetch origin main
            git reset --hard origin/main

            cd docker

            cat > .env <<'EOF'
            NODE_ENV=production
            ENVIRONMENT=production

            APP_URL=${{ vars.APP_URL }}
            WEB_URL=${{ vars.WEB_URL }}
            API_URL=${{ vars.API_URL }}

            PLATFORM_BASE_DOMAIN=${{ vars.PLATFORM_BASE_DOMAIN }}
            MARKETPLACE_AUTH_URL=${{ vars.MARKETPLACE_AUTH_URL }}
            MARKETPLACE_AUTH_EMAIL_FROM=${{ vars.MARKETPLACE_AUTH_EMAIL_FROM }}
            MARKETPLACE_AUTH_SECRET=${{ secrets.MARKETPLACE_AUTH_SECRET }}

            PLATFORM_AUTH_SECRET=${{ secrets.PLATFORM_AUTH_SECRET }}

            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DIRECT_URL=${{ secrets.DIRECT_URL }}

            INNGEST_EVENT_KEY=${{ secrets.INNGEST_EVENT_KEY }}
            INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}
            INNGEST_POSTGRES_PASSWORD=${{ secrets.INNGEST_POSTGRES_PASSWORD }}
            INNGEST_MAX_WORKER_CONCURRENCY=8

            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}

            EXA_API_KEY=${{ secrets.EXA_API_KEY }}

            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}

            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_PUBLIC_BASE_URL=${{ vars.R2_PUBLIC_BASE_URL }}

            GA4_API_SECRET=${{ secrets.GA4_API_SECRET }}

            EOF
            chmod 600 .env

            for variable in \
              PLATFORM_AUTH_SECRET \
              DATABASE_URL \
              DIRECT_URL \
              PLATFORM_BASE_DOMAIN \
              MARKETPLACE_AUTH_URL \
              MARKETPLACE_AUTH_SECRET \
              INNGEST_EVENT_KEY \
              INNGEST_SIGNING_KEY \
              INNGEST_POSTGRES_PASSWORD
            do
              if ! grep -q "^${variable}=." .env; then
                echo "Missing required production value: ${variable}" >&2
                exit 1
              fi
            done

            export TAG=${{ github.event.workflow_run.head_sha }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username samuelito22 --password-stdin

            docker pull ghcr.io/cloviana/api:${TAG}
            docker pull ghcr.io/cloviana/admin:${TAG}
            docker pull ghcr.io/cloviana/web:${TAG}

            docker compose -f compose-core.yaml -f compose-prod.yaml pull
            docker compose -f compose-core.yaml -f compose-prod.yaml up -d --remove-orphans
            
            docker compose -f compose-core.yaml -f compose-prod.yaml restart nginx

            # Never `system prune -af --volumes` here. `-a` deleted the
            # previous images, leaving no local rollback target for a bad
            # deploy, and `--volumes` puts postgres/redis/certbot data
            # in scope the moment a container is absent rather than stopped.
            # Keep a week of images so rolling back is a retag, not a re-pull.
            docker image prune -af --filter "until=168h"
            docker builder prune -f --filter "until=168h"
