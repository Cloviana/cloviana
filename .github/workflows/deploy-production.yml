name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [ completed ]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download workflow run info
        run: echo "TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host:      ${{ secrets.PROD_HOST }}
          username:  cloviana-admin
          key:       ${{ secrets.SSH_PRIVATE_KEY }}
          port:      22
          script: |
            set -e

            cd ~/cloviana/docker

            # Pull the exact image you just built
            docker pull ghcr.io/your-org/app:${TAG}

            # Optional: pull other service images
            # docker pull ...

            # Swap containers with zero-downtime (via Compose v2)
            docker compose \
              -f compose-core.yaml \
              -f compose-prod.yaml \
              pull
            docker compose \
              -f compose-core.yaml \
              -f compose-prod.yaml \
              up -d --remove-orphans

            # (Optional) Prune old images older than 7 days
            docker image prune --filter "until=168h" -f
