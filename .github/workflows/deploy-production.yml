name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Set TAG
        run: echo "TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port:     22
          script: |
            set -e

            cd /opt/cloviana
            git fetch origin main
            git reset --hard origin/main

            cd docker

            cat > .env <<'EOF'
            NODE_ENV=production
            ENVIRONMENT=production

            APP_URL=${{ vars.APP_URL }}
            WEB_URL=${{ vars.WEB_URL }}
            API_URL=${{ vars.API_URL }}

            SUPABASE_URL=${{ vars.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}

            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DIRECT_URL=${{ secrets.DIRECT_URL }}

            STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}

            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}

            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DATA_FOR_SEO_BASE64_CREDENTIALS=${{ secrets.DATA_FOR_SEO_BASE64_CREDENTIALS }}
            EXA_API_KEY=${{ secrets.EXA_API_KEY }}

            GA4_API_SECRET=${{ secrets.GA4_API_SECRET }}

            AGENT_INTERNAL_TOKEN=${{ secrets.AGENT_INTERNAL_TOKEN }}
            CLOVIANA_AGENT_DATABASE_URL=${{ secrets.CLOVIANA_AGENT_DATABASE_URL }}

            EOF
            chmod 600 .env

            export TAG=${{ github.event.workflow_run.head_sha }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username samuelito22 --password-stdin

            docker pull ghcr.io/cloviana/api:${TAG}
            docker pull ghcr.io/cloviana/agent:${TAG}
            docker pull ghcr.io/cloviana/app:${TAG}
            docker pull ghcr.io/cloviana/web:${TAG}

            docker compose -f compose-core.yaml -f compose-prod.yaml pull
            docker compose -f compose-core.yaml -f compose-prod.yaml up --no-deps --abort-on-container-exit --exit-code-from agent-migrate agent-migrate
            docker compose -f compose-core.yaml -f compose-prod.yaml up -d --remove-orphans
            
            docker compose -f compose-core.yaml -f compose-prod.yaml restart nginx

            docker system prune -af --volumes
