name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Set TAG
        run: echo "TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: cloviana-admin
          password: ${{ secrets.SSH_PASSWORD }}
          port:     22
          script: |
            set -e
            cd ~/cloviana/docker

            TAG=${TAG:-latest}

            echo "${{ secrets.PROD_REGISTRY_TOKEN }}" \
              | docker login ghcr.io --username samuelito22 --password-stdin

            docker pull ghcr.io/cloviana/api:${TAG}
            docker pull ghcr.io/cloviana/dashboard:${TAG}
            docker pull ghcr.io/cloviana/web:${TAG}

            docker compose -f compose-core.yml -f compose-prod.yml pull
            docker compose -f compose-core.yml -f compose-prod.yml up -d --remove-orphans

            docker image prune --filter "until=168h" -f
