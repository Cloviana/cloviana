mutation UpdateArticle($id: ID!, $article: ArticleUpdateInput!, $blog: ArticleBlogInput) {
  articleUpdate(id: $id, article: $article, blog: $blog) {
    article {
      id
      title
      handle
      image { altText originalSrc }
      summary
      tags
      publishedAt
      createdAt
      updatedAt
      blog { id title handle }
    }
    userErrors { field message }
  }
}
