query Articles($first: Int = 10, $query: String, $after: String) {
  articles(
    first: $first
    query: $query
    after: $after
    sortKey: PUBLISHED_AT
    reverse: true
  ) {
    nodes {
      id
      title
      handle
      body
      blog {
        id
        title
        handle
      }
      author {
        name
      }
      createdAt
      updatedAt
      publishedAt
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
